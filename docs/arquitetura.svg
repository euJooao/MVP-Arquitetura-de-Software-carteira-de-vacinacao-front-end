<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="300" fill="#f3f6f5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#155c43">Arquitetura — Cenário 1.1</text>

  <!-- Front-end -->
  <rect x="40" y="90" width="180" height="70" rx="12" fill="#e3f5ec" stroke="#1f7a5a" stroke-width="1.5"/>
  <text x="130" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#155c43">Front-end</text>
  <text x="130" y="140" text-anchor="middle" font-size="12" fill="#1f7a5a">interface · Docker</text>

  <!-- Back-end -->
  <rect x="320" y="90" width="180" height="70" rx="12" fill="#e3f5ec" stroke="#1f7a5a" stroke-width="1.5"/>
  <text x="410" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#155c43">Back-end (Flask)</text>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#1f7a5a">API REST · Docker</text>

  <!-- ViaCEP -->
  <rect x="600" y="90" width="180" height="70" rx="12" fill="#fde6e4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="690" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#922b21">ViaCEP</text>
  <text x="690" y="140" text-anchor="middle" font-size="12" fill="#c0392b">API externa</text>

  <!-- SQLite -->
  <rect x="320" y="220" width="180" height="56" rx="12" fill="#eceae3" stroke="#7a776e" stroke-width="1.5"/>
  <text x="410" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4842">SQLite</text>
  <text x="410" y="263" text-anchor="middle" font-size="12" fill="#7a776e">persistência</text>

  <!-- setas -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5d6b67" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="220" y1="125" x2="312" y2="125" stroke="#5d6b67" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="266" y="117" text-anchor="middle" font-size="11" fill="#5d6b67">REST/JSON</text>
  <line x1="500" y1="125" x2="592" y2="125" stroke="#5d6b67" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="546" y="117" text-anchor="middle" font-size="11" fill="#5d6b67">GET CEP</text>
  <line x1="410" y1="160" x2="410" y2="214" stroke="#5d6b67" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="452" y="192" text-anchor="middle" font-size="11" fill="#5d6b67">SQLAlchemy</text>
</svg>
